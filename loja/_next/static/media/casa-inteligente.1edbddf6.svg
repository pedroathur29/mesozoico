<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
  <!-- Ilustração da casa inteligente do banner principal (TECHNOVA). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F6FA"/><stop offset="1" stop-color="#D6DDE8"/></linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D2E0"/><stop offset="1" stop-color="#A9B5C8"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B2A22"/><stop offset="1" stop-color="#5A4031"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7AE"/><stop offset=".6" stop-color="#FFC76B"/><stop offset="1" stop-color="#F6A94A"/></linearGradient>
    <linearGradient id="winCool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9E6FF"/><stop offset="1" stop-color="#8DB0FF"/></linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7D0DE"/></linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2A5C"/><stop offset="1" stop-color="#02153F" stop-opacity="0"/></linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0153FC"/><stop offset="1" stop-color="#4D7DFD"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD98A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD98A" stop-opacity="0"/></radialGradient>
    <radialGradient id="blueHalo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4D7DFD" stop-opacity=".9"/><stop offset="1" stop-color="#4D7DFD" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- chão -->
  <ellipse cx="600" cy="760" rx="600" ry="90" fill="url(#lawn)"/>
  <ellipse cx="600" cy="742" rx="520" ry="24" fill="#010D29" opacity=".55" filter="url(#blur)"/>

  <!-- árvores ao fundo -->
  <g fill="#0B2457">
    <path d="M70 740 C40 640 60 520 120 470 C180 520 200 640 170 740Z"/>
    <path d="M1080 740 C1050 620 1070 500 1130 450 C1190 500 1210 620 1180 740Z"/>
  </g>
  <g fill="#123067">
    <path d="M135 740 C115 660 125 580 165 545 C205 580 215 660 195 740Z"/>
    <path d="M1010 740 C990 670 1000 600 1040 570 C1080 600 1090 670 1070 740Z"/>
  </g>

  <!-- volume térreo -->
  <rect x="150" y="470" width="900" height="270" fill="url(#wall)"/>
  <rect x="150" y="470" width="190" height="270" fill="url(#wallShade)"/>
  <!-- garagem -->
  <rect x="180" y="560" width="140" height="180" rx="4" fill="#2A3A5A"/>
  <g stroke="#3B4D72" stroke-width="2">
    <path d="M180 590 H320"/><path d="M180 620 H320"/><path d="M180 650 H320"/><path d="M180 680 H320"/><path d="M180 710 H320"/>
  </g>
  <!-- vidraça da sala -->
  <rect x="370" y="520" width="420" height="220" fill="url(#win)"/>
  <g stroke="#2A2F3A" stroke-width="6"><path d="M475 520 V740"/><path d="M580 520 V740"/><path d="M685 520 V740"/><path d="M370 520 H790"/></g>
  <!-- interior: sofá, luminária, TV -->
  <rect x="400" y="670" width="160" height="40" rx="10" fill="#7A4E32" opacity=".55"/>
  <rect x="410" y="650" width="140" height="28" rx="10" fill="#8F5E3D" opacity=".5"/>
  <path d="M640 600 L660 560 L680 600Z" fill="#FFF3D1"/><path d="M660 600 V710" stroke="#5C4030" stroke-width="4"/>
  <ellipse cx="660" cy="590" rx="70" ry="60" fill="url(#halo)"/>
  <rect x="705" y="600" width="70" height="44" rx="4" fill="#1B2440" opacity=".7"/>
  <!-- porta de entrada -->
  <rect x="830" y="560" width="96" height="180" fill="url(#wood)"/>
  <rect x="908" y="640" width="6" height="34" rx="3" fill="#D7DDE7"/>
  <!-- fechadura digital (destaque) -->
  <rect x="896" y="620" width="22" height="46" rx="5" fill="#02153F"/>
  <circle cx="907" cy="633" r="4" fill="#4D7DFD"/>
  <circle cx="907" cy="633" r="16" fill="url(#blueHalo)"/>
  <!-- campainha com vídeo -->
  <rect x="944" y="620" width="16" height="40" rx="8" fill="#02153F"/>
  <circle cx="952" cy="650" r="4" fill="#4D7DFD"/>
  <!-- luz de parede -->
  <rect x="960" y="560" width="40" height="10" rx="3" fill="#E6EBF3"/>
  <ellipse cx="980" cy="600" rx="60" ry="50" fill="url(#halo)"/>

  <!-- laje entre pavimentos -->
  <rect x="120" y="452" width="960" height="26" fill="url(#slab)"/>
  <rect x="120" y="474" width="960" height="6" fill="#9AA7BB" opacity=".6"/>

  <!-- volume superior em balanço -->
  <rect x="300" y="250" width="680" height="202" fill="url(#wall)"/>
  <rect x="300" y="250" width="200" height="202" fill="url(#wood)"/>
  <g stroke="#2E211A" stroke-width="3" opacity=".6">
    <path d="M325 250 V452"/><path d="M350 250 V452"/><path d="M375 250 V452"/><path d="M400 250 V452"/><path d="M425 250 V452"/><path d="M450 250 V452"/><path d="M475 250 V452"/>
  </g>
  <rect x="540" y="290" width="400" height="130" fill="url(#win)"/>
  <g stroke="#2A2F3A" stroke-width="6"><path d="M673 290 V420"/><path d="M806 290 V420"/></g>
  <!-- cama / estante -->
  <rect x="560" y="380" width="100" height="24" rx="6" fill="#7A4E32" opacity=".45"/>
  <rect x="830" y="320" width="90" height="10" fill="#5C4030" opacity=".5"/><rect x="830" y="350" width="90" height="10" fill="#5C4030" opacity=".5"/>
  <!-- quarto com luz fria (automação de cena) -->
  <rect x="520" y="440" width="0" height="0"/>
  <!-- telhado plano -->
  <rect x="270" y="228" width="740" height="26" fill="url(#slab)"/>
  <rect x="270" y="252" width="740" height="5" fill="#9AA7BB" opacity=".6"/>

  <!-- câmera externa no canto -->
  <g transform="translate(990 300)">
    <rect x="-6" y="-14" width="14" height="30" rx="4" fill="#E6EBF3"/>
    <g transform="rotate(18)">
      <rect x="-46" y="-6" width="46" height="20" rx="10" fill="#FFFFFF"/>
      <circle cx="-42" cy="4" r="7" fill="#02153F"/>
    </g>
  </g>
  <!-- cone de visão da câmera -->
  <path d="M948 318 L760 560 L1060 560Z" fill="#4D7DFD" opacity=".08"/>

  <!-- piscina -->
  <path d="M440 770 L820 770 L860 800 L400 800Z" fill="url(#pool)" opacity=".9"/>
  <path d="M470 782 Q520 776 570 782 T670 782 T770 782" stroke="#BFD3FF" stroke-width="2" fill="none" opacity=".7"/>

  <!-- balizadores do jardim -->
  <g>
    <rect x="360" y="742" width="6" height="16" fill="#E6EBF3"/><ellipse cx="363" cy="742" rx="26" ry="14" fill="url(#halo)"/>
    <rect x="880" y="742" width="6" height="16" fill="#E6EBF3"/><ellipse cx="883" cy="742" rx="26" ry="14" fill="url(#halo)"/>
  </g>

  <!-- ondas de conectividade sobre a casa -->
  <g fill="none" stroke="#4D7DFD" stroke-linecap="round">
    <path d="M590 190 Q640 150 690 190" stroke-width="6" opacity=".9"/>
    <path d="M560 160 Q640 100 720 160" stroke-width="6" opacity=".55"/>
    <path d="M530 130 Q640 50 750 130" stroke-width="6" opacity=".3"/>
  </g>
  <circle cx="640" cy="205" r="9" fill="#4D7DFD"/>
</svg>
